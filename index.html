<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>숫자 맞추기 게임</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #333;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin-top: 50px;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.2rem;
        }
        input, button {
            font-size: 1rem;
            padding: 10px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        button {
            background-color: #6c63ff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #4c4c9d;
        }
        .result {
            margin-top: 20px;
            font-size: 1.5rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>숫자 맞추기 게임</h1>
    <p>1부터 10 사이의 숫자를 맞춰보세요!</p>
    <input type="number" id="guess" placeholder="숫자를 입력하세요" min="1" max="10">
    <button onclick="checkGuess()">확인</button>
    <div class="result" id="result"></div>

    <script>
        // 1부터 10 사이의 랜덤 숫자 생성
        const randomNumber = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {
            const userGuess = document.getElementById('guess').value;
            const result = document.getElementById('result');

            if (!userGuess) {
                result.textContent = "숫자를 입력하세요!";
                result.style.color = "red";
                return;
            }

            if (userGuess == randomNumber) {
                result.textContent = "정답입니다! 🎉";
                result.style.color = "green";
            } else if (userGuess < randomNumber) {
                result.textContent = "더 큰 숫자를 입력해보세요!";
                result.style.color = "blue";
            } else {
                result.textContent = "더 작은 숫자를 입력해보세요!";
                result.style.color = "blue";
            }
        }
    </script>
</body>
</html>
