<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공부 도우미</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: #f4f4f9;
            color: #333;
        }
        header {
            background: #6c63ff;
            color: white;
            padding: 20px;
            text-align: center;
        }
        nav {
            background: #4c4c9d;
            color: white;
            padding: 10px;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }
        nav a:hover {
            text-decoration: underline;
        }
        section {
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin: 20px 0;
            padding: 15px;
        }
        footer {
            background: #333;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>
    <header>
        <h1>공부 도우미</h1>
        <p>효율적인 학습을 위한 최고의 도구</p>
    </header>
    <nav>
        <a href="#resources">학습 자료</a>
        <a href="#schedule">일정 관리</a>
        <a href="#motivation">동기 부여</a>
    </nav>
    <section id="resources">
        <h2>학습 자료</h2>
        <div class="card">
            <h3>수학</h3>
            <p>수학 공식과 문제 풀이 자료를 확인하세요.</p>
        </div>
        <div class="card">
            <h3>과학</h3>
            <p>과학 실험과 이론 자료를 확인하세요.</p>
        </div>
    </section>
    <section id="schedule">
        <h2>일정 관리</h2>
        <div class="card">
            <p>오늘의 할 일:</p>
            <ul>
                <li>수학 숙제 완료</li>
                <li>과학 시험 준비</li>
                <li>독서 30분</li>
            </ul>
        </div>
    </section>
    <section id="motivation">
        <h2>동기 부여</h2>
        <div class="card">
            <p>"성공은 준비와 기회의 만남이다." - 오프라 윈프리</p>
        </div>
        <div class="card">
            <p>"포기하지 마세요. 위대한 일은 시간이 걸립니다."</p>
        </div>
    </section>
    <footer>
        <p>&copy; 2026 공부 도우미. All rights reserved.</p>
    </footer>
</body>
</html>
